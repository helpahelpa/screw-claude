name: Deploy to GitHub Pages

# The site is static: the build has no dependencies, so the workflow only needs
# Node itself. `ui-prototype/` is published as the artifact root, which is why
# every runtime URL is mount-relative (see src/content/paths.ts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the site and its metadata
        working-directory: ui-prototype
        run: node build.mjs
      - name: Run the dependency-free test suite
        working-directory: ui-prototype
        run: node --test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui-prototype

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
